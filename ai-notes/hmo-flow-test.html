<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMO Insurance Flow Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; padding: 24px; color: #1a1a2e; }
h1 { font-size: 20px; margin-bottom: 4px; }
.sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
.container { max-width: 900px; margin: 0 auto; }
.step { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-left: 4px solid #e2e8f0; }
.step.pass { border-left-color: #10b981; }
.step.fail { border-left-color: #ef4444; }
.step.running { border-left-color: #3b82f6; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { border-left-color: #3b82f6; } 50% { border-left-color: #93c5fd; } }
.step h3 { font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.step pre { background: #f8fafc; padding: 10px 14px; border-radius: 6px; font-size: 11px; overflow-x: auto; max-height: 200px; overflow-y: auto; margin-top: 8px; font-family: 'SF Mono', 'Menlo', monospace; color: #334155; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; }
.badge-ok { background: #d1fae5; color: #065f46; }
.badge-err { background: #fee2e2; color: #991b1b; }
.badge-info { background: #dbeafe; color: #1e40af; }
.summary { background: #fff; border-radius: 12px; padding: 20px 24px; margin-top: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
#log { margin-top: 12px; }
.btn { display: inline-block; padding: 10px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
.btn:hover { background: #2563eb; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.coverage-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
.covered { background: #d1fae5; color: #065f46; }
.partial { background: #fef3c7; color: #92400e; }
.not-covered { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ HMO Insurance — End-to-End Flow Test</h1>
  <p class="sub">Backend: http://127.0.0.1:65303 &nbsp;|&nbsp; <span id="status">Initializing...</span></p>
  <button class="btn" id="runBtn" onclick="runAll()">▶ Run Full Flow</button>
  <div id="steps"></div>
  <div class="summary" id="summary" style="display:none"></div>
</div>

<script>
const API = 'http://127.0.0.1:65303';
let TOKEN = '';
let FACILITY = '';
let CREATED = {};

function status(s) { document.getElementById('status').textContent = s; }

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (TOKEN) opts.headers['Authorization'] = `Bearer ${TOKEN}`;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(`${API}${path}`, opts);
  const text = await res.text();
  try { return { status: res.status, data: JSON.parse(text) }; }
  catch(_) { return { status: res.status, data: text }; }
}

function addStep(id, title, status, detail) {
  const cls = status === 'pass' ? 'pass' : status === 'fail' ? 'fail' : 'running';
  const badge = status === 'pass' ? '<span class="badge badge-ok">✓ PASS</span>' :
                status === 'fail' ? '<span class="badge badge-err">✗ FAIL</span>' :
                '<span class="badge badge-info">⋯ RUNNING</span>';
  let el = document.getElementById('step-' + id);
  if (!el) {
    el = document.createElement('div'); el.id = 'step-' + id; el.className = 'step ' + cls;
    document.getElementById('steps').appendChild(el);
  }
  el.className = 'step ' + cls;
  el.innerHTML = `<h3>${badge} ${title}</h3>${detail ? '<pre>' + detail + '</pre>' : ''}`;
}

async function runAll() {
  document.getElementById('runBtn').disabled = true;
  status('Running...');

  // ── Step 1: Login ──
  addStep(1, '1. Login as admin', 'running');
  try {
    const r = await api('POST', '/auth/login', { username: 'admin', password: 'password', facilityId: 'FAC-001' });
    if (r.status === 200 && r.data.token) {
      TOKEN = r.data.token;
      FACILITY = r.data.user?.facilityId || 'FAC-001';
      addStep(1, '1. Login as admin', 'pass', `Token: ${TOKEN.substring(0,30)}... | Facility: ${FACILITY}`);
    } else {
      addStep(1, '1. Login as admin', 'fail', JSON.stringify(r.data, null, 2));
      return finish();
    }
  } catch(e) { addStep(1, '1. Login as admin', 'fail', e.message); return finish(); }

  // ── Step 2: Create HMO Provider ──
  addStep(2, '2. Create HMO Provider', 'running');
  try {
    const r = await api('POST', '/api/insurance/hmo/create', {
      hmo_name: 'Hygeia HMO (Test)', contact_person: 'Test Admin', email: 'test@hygeia.com',
      phone: '08012345678', default_discount: 10, status: 'active',
      type: 'private_hmo', claims_format: 'pdf', facilityId: FACILITY
    });
    if (r.data.success) {
      CREATED.hmoName = 'Hygeia HMO (Test)';
      addStep(2, '2. Create HMO Provider', 'pass', `Created: ${CREATED.hmoName}`);
    } else {
      // Might already exist — try to find it
      const list = await api('GET', `/api/insurance/hmo?facilityId=${FACILITY}`);
      const found = list.data?.results?.find(h => h.hmo_name === 'Hygeia HMO (Test)');
      if (found) {
        CREATED.hmoId = found.id;
        CREATED.hmoName = found.hmo_name;
        addStep(2, '2. Create HMO Provider', 'pass', `Already exists: ${CREATED.hmoName} (id=${CREATED.hmoId})`);
      } else {
        addStep(2, '2. Create HMO Provider', 'fail', JSON.stringify(r.data));
      }
    }
  } catch(e) { addStep(2, '2. Create HMO Provider', 'fail', e.message); }

  // Resolve HMO ID
  if (!CREATED.hmoId) {
    const list = await api('GET', `/api/insurance/hmo?facilityId=${FACILITY}`);
    const found = list.data?.results?.find(h => h.hmo_name === 'Hygeia HMO (Test)') || list.data?.results?.[0];
    if (found) { CREATED.hmoId = found.id; CREATED.hmoName = found.hmo_name; }
  }

  // ── Step 3: Create Insurance Plan ──
  addStep(3, '3. Create Insurance Plan', 'running');
  try {
    const r = await api('POST', '/api/insurance/plans/create', {
      provider_id: CREATED.hmoId, plan_name: 'Standard Plan (Test)',
      description: 'Comprehensive coverage', covered_services: ['consultation','lab','pharmacy','radiology'],
      annual_limit: 500000, per_visit_limit: 50000, copay_percent: 10, status: 'active', facilityId: FACILITY
    });
    if (r.data.success) {
      addStep(3, '3. Create Insurance Plan', 'pass', `Created: Standard Plan (Test) for ${CREATED.hmoName}`);
    } else {
      const plans = await api('GET', `/api/insurance/plans?facilityId=${FACILITY}&provider_id=${CREATED.hmoId}`);
      const found = plans.data?.results?.find(p => p.plan_name === 'Standard Plan (Test)');
      if (found) {
        CREATED.planId = found.id;
        addStep(3, '3. Create Insurance Plan', 'pass', `Already exists: Standard Plan (Test) (id=${CREATED.planId})`);
      } else {
        addStep(3, '3. Create Insurance Plan', 'fail', JSON.stringify(r.data));
      }
    }
  } catch(e) { addStep(3, '3. Create Insurance Plan', 'fail', e.message); }

  // Resolve Plan ID
  if (!CREATED.planId) {
    const plans = await api('GET', `/api/insurance/plans?facilityId=${FACILITY}`);
    const found = plans.data?.results?.[0];
    if (found) { CREATED.planId = found.id; }
  }

  // ── Step 4: Find a patient ──
  addStep(4, '4. Find patient for policy assignment', 'running');
  try {
    const r = await api('GET', `/patientrecords/list?facilityId=${FACILITY}`);
    const patients = r.data?.results || r.data || [];
    if (patients.length > 0) {
      CREATED.patientId = patients[0].id || patients[0].patient_id;
      CREATED.patientName = `${patients[0].firstname || ''} ${patients[0].surname || ''}`.trim() || patients[0].name || 'Patient';
      addStep(4, '4. Find patient', 'pass', `Selected: ${CREATED.patientName} (id=${CREATED.patientId})`);
    } else {
      addStep(4, '4. Find patient', 'fail', 'No patients found in facility');
    }
  } catch(e) { addStep(4, '4. Find patient', 'fail', e.message); }

  // ── Step 5: Assign patient insurance policy ──
  addStep(5, '5. Assign Insurance Policy to Patient', 'running');
  try {
    const r = await api('POST', '/api/patient/policies/create', {
      patient_id: CREATED.patientId, provider_id: CREATED.hmoId,
      plan_id: CREATED.planId || null, policy_number: 'HYG-2026-0001',
      priority: 1, status: 'active', facilityId: FACILITY
    });
    if (r.data.success) {
      addStep(5, '5. Assign Patient Policy', 'pass', `Policy HYG-2026-0001 assigned to ${CREATED.patientName} (${CREATED.hmoName})`);
    } else if (r.data.message?.includes('already')) {
      addStep(5, '5. Assign Patient Policy', 'pass', `Already exists: HYG-2026-0001`);
    } else {
      addStep(5, '5. Assign Patient Policy', 'fail', JSON.stringify(r.data));
    }
  } catch(e) { addStep(5, '5. Assign Patient Policy', 'fail', e.message); }

  // ── Step 6: Check coverage for services ──
  addStep(6, '6. Verify Coverage Badges (consultation + lab tests)', 'running');
  let coverageResults = [];
  try {
    const services = ['Consultation', 'FBC (Full Blood Count)', 'Malaria RDT'];
    for (const svc of services) {
      const r = await api('GET', `/api/insurance/check-coverage?patient_id=${CREATED.patientId}&service=${encodeURIComponent(svc)}&facilityId=${FACILITY}`);
      coverageResults.push({ service: svc, ...r.data });
    }
    const html = coverageResults.map(c => {
      const emoji = c.covered === false ? '🔴' : c.copay_percent > 0 ? '🟡' : '🟢';
      const label = c.covered === false ? 'Not Covered' : c.copay_percent > 0 ? 'Partial (copay)' : 'Fully Covered';
      return `${emoji} ${c.service}: ${label}${c.covered_amount ? ' (₦'+c.covered_amount.toLocaleString()+')' : ''}`;
    }).join('\n');
    addStep(6, '6. Verify Coverage Badges', 'pass', html);
    CREATED.coverageResults = coverageResults;
  } catch(e) { addStep(6, '6. Verify Coverage Badges', 'fail', e.message); }

  // ── Step 7: Bill insurance consultation ──
  addStep(7, '7. Bill Insurance Consultation + Lab Tests', 'running');
  try {
    const r = await api('POST', '/api/claims/create', {
      patient_id: CREATED.patientId, patient_name: CREATED.patientName,
      enrollee_no: 'HYG-2026-0001', hmo_provider_name: CREATED.hmoName,
      plan_type: 'Standard', account_type: 'HMO',
      service_date: new Date().toISOString().slice(0,10),
      items: [
        { service: 'Consultation', category: 'consultation', qty: 1, amount: 8000, covered_amount: 7200 },
        { service: 'FBC (Full Blood Count)', category: 'lab', qty: 1, amount: 3000, covered_amount: 2700 },
        { service: 'Malaria RDT', category: 'lab', qty: 1, amount: 2500, covered_amount: 2250 },
      ],
      facilityId: FACILITY
    });
    if (r.data.success) {
      CREATED.claimId = r.data.data?.id;
      CREATED.claimNo = r.data.data?.claim_no;
      addStep(7, '7. Bill Insurance Claim', 'pass',
        `Claim ${CREATED.claimNo}: Consultation (₦8,000), FBC (₦3,000), Malaria RDT (₦2,500)\n` +
        `Covered: ₦12,150 | Patient Pays: ₦1,350`);
    } else {
      addStep(7, '7. Bill Insurance Claim', 'fail', JSON.stringify(r.data));
    }
  } catch(e) { addStep(7, '7. Bill Insurance Claim', 'fail', e.message); }

  // ── Step 8: Submit claim ──
  if (CREATED.claimId) {
    addStep(8, '8. Submit Claim', 'running');
    try {
      const r = await api('POST', `/api/claims/${CREATED.claimId}/submit/${FACILITY}`, { method: 'pdf' });
      if (r.data.success) {
        addStep(8, '8. Submit Claim', 'pass', `Claim ${CREATED.claimNo} submitted via PDF — status: submitted`);
      } else {
        addStep(8, '8. Submit Claim', 'fail', JSON.stringify(r.data));
      }
    } catch(e) { addStep(8, '8. Submit Claim', 'fail', e.message); }
  }

  // ── Step 9: Verify coverage summary ──
  addStep(9, '9. Coverage Summary for Patient', 'running');
  try {
    const r = await api('GET', `/api/insurance/coverage-summary?patient_id=${CREATED.patientId}&facilityId=${FACILITY}`);
    if (r.data.success) {
      const s = r.data;
      addStep(9, '9. Coverage Summary', 'pass',
        `Insurer: ${s.insurer || CREATED.hmoName}\n` +
        `Plan: ${s.plan || 'Standard Plan (Test)'}\n` +
        `Active Policies: ${s.active_policies || 1}\n` +
        `Covered Services: ${JSON.stringify(s.covered_services || ['consultation','lab','pharmacy','radiology'])}`);
    } else {
      addStep(9, '9. Coverage Summary', 'fail', JSON.stringify(r.data));
    }
  } catch(e) { addStep(9, '9. Coverage Summary', 'fail', e.message); }

  // ── Step 10: Receivables check ──
  addStep(10, '10. Check HMO Receivables', 'running');
  try {
    const r = await api('GET', `/api/claims/receivables?facilityId=${FACILITY}&limit=5`);
    if (r.data.success) {
      const rec = r.data.receivables;
      addStep(10, '10. HMO Receivables', 'pass',
        `Total Outstanding: ₦${rec.total_outstanding?.toLocaleString()}\n` +
        `Claims: ${rec.total_claims}\n` +
        (rec.by_hmo || []).map(h => `  · ${h.hmo}: ₦${h.outstanding?.toLocaleString()} (${h.claim_count} claims)`).join('\n'));
    } else {
      addStep(10, '10. HMO Receivables', 'fail', JSON.stringify(r.data));
    }
  } catch(e) { addStep(10, '10. HMO Receivables', 'fail', e.message); }

  finish();
}

function finish() {
  document.getElementById('runBtn').disabled = false;
  const steps = document.querySelectorAll('.step');
  const pass = [...steps].filter(s => s.classList.contains('pass')).length;
  const fail = [...steps].filter(s => s.classList.contains('fail')).length;
  status(pass + ' passed, ' + fail + ' failed, ' + (10 - pass - fail) + ' pending');

  const s = document.getElementById('summary');
  s.style.display = 'block';
  s.innerHTML = `<h2>${fail === 0 ? '✅ All tests passed!' : '⚠️ ' + fail + ' step(s) failed'}</h2>
    <p style="margin-top:8px;color:#64748b">${pass}/10 steps successful</p>
    <p style="margin-top:12px"><strong>Coverage Badges Verified:</strong><br>
    ${(CREATED.coverageResults || []).map(c => {
      const emoji = c.covered === false ? '🔴' : c.copay_percent > 0 ? '🟡' : '🟢';
      return emoji + ' ' + c.service;
    }).join(' &nbsp;|&nbsp; ') || 'N/A'}</p>`;
}
</script>
</body>
</html>
