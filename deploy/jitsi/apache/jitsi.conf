# Jitsi Meet behind an existing Apache that already owns ports 80/443.
# See deploy/jitsi/README.md §8.1. Requires: proxy proxy_http proxy_wstunnel
# headers ssl rewrite.
#
# The Jitsi containers must run with:
#   DISABLE_HTTPS=1  ENABLE_HTTP_REDIRECT=0  ENABLE_LETSENCRYPT=0
#   HTTP_PORT=127.0.0.1:8000  HTTPS_PORT=127.0.0.1:8443
#   PUBLIC_URL=https://<this ServerName>
#
# Only signalling goes through this proxy. Audio/video go straight to JVB on
# 10000/udp, so keep the JVB firewall rules from the runbook.
#
# Install:
#   sudo cp jitsi.conf /etc/apache2/sites-available/jitsi.conf
#   sudo a2ensite jitsi && sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName jitsi.example.com

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName jitsi.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/jitsi.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/jitsi.example.com/privkey.pem
    # Modern TLS only; Jitsi clients are all browsers/WebRTC stacks.
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite        ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder   off

    ProxyRequests     Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # XMPP over WebSocket: the default signalling transport. Needs the upgrade.
    # Must come first so it is not swallowed by the catch-all below.
    ProxyPass        /xmpp-websocket ws://127.0.0.1:8000/xmpp-websocket
    ProxyPassReverse /xmpp-websocket ws://127.0.0.1:8000/xmpp-websocket

    # BOSH: plain HTTP long-polling fallback for networks that block WebSockets.
    ProxyPass        /http-bind http://127.0.0.1:8000/http-bind
    ProxyPassReverse /http-bind http://127.0.0.1:8000/http-bind

    # Web app and static assets. BOSH long-polls stay open, so allow time.
    ProxyTimeout     300
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Do not proxy /colibri-ws: that route and its env vars were removed in
    # stable-11146+. Media does not use the proxy at all.

    ErrorLog  ${APACHE_LOG_DIR}/jitsi-error.log
    CustomLog ${APACHE_LOG_DIR}/jitsi-access.log combined
</VirtualHost>
</IfModule>
